# 放到 /etc/nginx/conf.d/xueqing.conf，把 example.com 换成你的域名
limit_req_zone $binary_remote_addr zone=xq_api:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=xq_conn:10m;
server {
    listen 80;
    server_name example.com;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl http2;
    server_name example.com;
    ssl_certificate     /etc/nginx/ssl/example.com.pem;   # 证书在阿里云/腾讯云可以免费申请
    ssl_certificate_key /etc/nginx/ssl/example.com.key;
    client_max_body_size 100m;                            # 一次可以上传多张图片
    server_tokens off;
    limit_conn xq_conn 30;
    location /api/ {
        limit_req zone=xq_api burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}
